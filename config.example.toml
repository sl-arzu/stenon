# Configurazione Stenon — copia in config.toml per usarla.
# Percorsi con ~ vengono espansi alla home dell'utente.

# Percorso del modello Whisper ggml (scaricabile con scripts/fetch-model.sh).
model_path = "~/.local/share/stenon/models/ggml-base.bin"

# Lingua di trascrizione: codice ISO ("it", "en") o "auto".
language_mode = "it"

# Scorciatoia push-to-talk: tieni premuto mentre parli, rilascia per trascrivere.
hotkey = "Ctrl+Shift+Space"

# Modalità di inserimento del testo: "type" (simula digitazione) o "clipboard".
paste_mode = "type"

# Percorso del database SQLite delle note.
db_path = "~/.local/share/stenon/notes.db"
