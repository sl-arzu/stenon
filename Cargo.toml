[workspace]
resolver = "2"
members = ["crates/stenon-core", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["sl-arzu"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
