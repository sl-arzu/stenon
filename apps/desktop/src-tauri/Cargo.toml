[package]
name = "stenon-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stenon — dettatura vocale locale, app desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stenon-core = { path = "../../../crates/stenon-core", features = ["whisper"] }
enigo = "0.2"
global-hotkey = "0.5"
